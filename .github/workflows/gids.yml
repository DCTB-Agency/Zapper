name: Gids vernieuwen en publiceren

on:
  schedule:
    - cron: "15 3 * * *"    # elke nacht (05:15 zomertijd, 04:15 wintertijd)
    - cron: "15 9 * * *"    # overdag nog drie keer, zodat nieuwe streamingtitels snel verschijnen
    - cron: "15 13 * * *"   # en in de namiddag, voor last-minute wijzigingen
    - cron: "15 17 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # voor het levend houden van de geplande workflows

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detailcache herstellen
        uses: actions/cache@v4
        with:
          path: .cache
          key: details-${{ github.run_id }}
          restore-keys: details-
      - name: Gids ophalen
        run: python3 gids.py --stad "${{ vars.TELENET_STAD || '20001' }}"
      - name: Streamingdiensten ophalen
        continue-on-error: true   # lukt dit niet, dan blijft de tv-gids gewoon werken
        run: python3 streaming.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  levend-houden:
    # GitHub zet geplande workflows in een publieke repo stil na 60 dagen zonder commits.
    # Ze opnieuw "enable" maken zet die teller terug, zonder commits te maken.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Geplande workflows actief houden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in gids.yml meldingen.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
